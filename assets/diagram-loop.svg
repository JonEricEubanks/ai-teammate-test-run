<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17594f"/><stop offset="1" stop-color="#0c352f"/></linearGradient>
    <linearGradient id="gYou" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#ffe9c7"/></linearGradient>
    <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf6"/><stop offset="1" stop-color="#cdf0e7"/></linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effaf2"/><stop offset="1" stop-color="#d3f0dc"/></linearGradient>
    <linearGradient id="gMedal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc35c"/><stop offset="1" stop-color="#ff7b1c"/></linearGradient>
    <radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9f1c" stop-opacity=".5"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowT" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#55d8c7" stop-opacity=".35"/><stop offset="1" stop-color="#55d8c7" stop-opacity="0"/></radialGradient>
    <filter id="softD" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#062421" flood-opacity="0.4"/></filter>
    <marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb35c"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#43dcc6"/></marker>
    <path id="spk" d="M0 -6 C .8 -2, 2 -.8, 6 0 C 2 .8, .8 2, 0 6 C -.8 2, -2 .8, -6 0 C -2 -.8, -.8 -2, 0 -6 Z"/>
  </defs>

  <style>
    .ttl  { font-size: 16.5px; font-weight: 700; }
    .sub  { font-size: 12.5px; opacity: .78; }
    .num  { font-size: 12px; font-weight: 800; fill: #fff; }
    .chipT{ font-size: 11px; font-weight: 700; }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.9s}
    @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
    .flowM { fill:none; stroke:#ffb35c; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    .flowT { fill:none; stroke:#43dcc6; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -9; } }
    .bob  { animation: bob 3.2s ease-in-out infinite; }
    .bob2 { animation: bob 3.2s ease-in-out infinite .7s; }
    @keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-3px) } }
    .haloA { transform-origin: 490px 300px; animation: spin 16s linear infinite; }
    .haloB { transform-origin: 490px 300px; animation: spin 26s linear infinite reverse; }
    .pulseMedal { transform-origin: 490px 300px; animation: pm 2.6s ease-in-out infinite; }
    @keyframes pm { 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.06) } }
    .shine { transform-origin: 490px 300px; animation: spin 5.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .tw { opacity: .45; animation: tw 2.6s ease-in-out infinite alternate; }
    .tw2 { animation-duration: 3.4s; animation-delay: .8s; }
    .tw3 { animation-duration: 2.1s; animation-delay: .4s; }
    .tw4 { animation-duration: 3s; animation-delay: 1.2s; }
    @keyframes tw { from{opacity:.1} to{opacity:.85} }
    @media (prefers-reduced-motion: reduce) {
      .rise,.flowM,.flowT,.bob,.bob2,.haloA,.haloB,.pulseMedal,.shine,.tw { animation: none; }
      .comet { display: none; }
    }
  </style>

  <!-- backdrop -->
  <rect x="10" y="10" width="960" height="600" rx="28" fill="url(#bgD)"/>
  <ellipse cx="150" cy="140" rx="240" ry="160" fill="url(#glowT)"/>
  <ellipse cx="850" cy="500" rx="260" ry="170" fill="url(#glowO)"/>

  <!-- sparkles -->
  <use href="#spk" transform="translate(330 62) scale(.8)" fill="#bff2e9" class="tw"/>
  <use href="#spk" transform="translate(656 54) scale(.6)" fill="#ffe3bd" class="tw tw2"/>
  <use href="#spk" transform="translate(72 300) scale(.7)" fill="#bff2e9" class="tw tw3"/>
  <use href="#spk" transform="translate(908 300) scale(.8)" fill="#ffe3bd" class="tw tw4"/>
  <use href="#spk" transform="translate(296 436) scale(.55)" fill="#bff2e9" class="tw tw2"/>
  <use href="#spk" transform="translate(684 436) scale(.5)" fill="#ffe3bd" class="tw tw3"/>

  <!-- header -->
  <text x="490" y="48" text-anchor="middle" font-size="13" letter-spacing="4" font-weight="800" fill="#8fe0d2">THE DELEGATION LOOP</text>
  <text x="490" y="70" text-anchor="middle" font-size="11.5" fill="#a9ccc5">crisp issue in · pull request out · repeat</text>

  <!-- top arc: you → agent -->
  <g class="rise d2">
    <path class="flowM" d="M245 140 H 727" marker-end="url(#arM)"/>
    <g class="comet"><animateMotion dur="2s" repeatCount="indefinite" path="M245 140 H 727"/><circle r="8" fill="#ffb35c" opacity=".3"/><circle r="4" fill="#ffe3bd"/></g>
    <rect x="440" y="104" width="100" height="24" rx="12" fill="#0d3a33" stroke="#ffb35c" stroke-width="1.5"/>
    <text class="chipT" x="490" y="120" text-anchor="middle" fill="#ffd9a8">crisp issue</text>
  </g>

  <!-- right arc: agent → review -->
  <g class="rise d3">
    <path class="flowM" d="M830 186 V 416" marker-end="url(#arM)"/>
    <g class="comet"><animateMotion dur="2s" begin=".4s" repeatCount="indefinite" path="M830 186 V 416"/><circle r="8" fill="#ffb35c" opacity=".3"/><circle r="4" fill="#ffe3bd"/></g>
    <rect x="750" y="293" width="160" height="24" rx="12" fill="#0d3a33" stroke="#ffb35c" stroke-width="1.5"/>
    <text class="chipT" x="830" y="309" text-anchor="middle" fill="#ffd9a8">autonomous commits</text>
  </g>

  <!-- bottom arc: review → merge -->
  <g class="rise d4">
    <path class="flowM" d="M735 470 H 253" marker-end="url(#arM)"/>
    <g class="comet"><animateMotion dur="2.2s" begin=".2s" repeatCount="indefinite" path="M735 470 H 253"/><circle r="8" fill="#ffb35c" opacity=".3"/><circle r="4" fill="#ffe3bd"/></g>
    <rect x="435" y="436" width="110" height="24" rx="12" fill="#0d3a33" stroke="#ffb35c" stroke-width="1.5"/>
    <text class="chipT" x="490" y="452" text-anchor="middle" fill="#ffd9a8">approved PR</text>
  </g>

  <!-- left return: next task -->
  <g class="rise d5">
    <path class="flowM" style="stroke-dasharray:1 7" opacity=".8" d="M150 424 V 194" marker-end="url(#arM)"/>
    <g class="comet"><animateMotion dur="2s" begin=".6s" repeatCount="indefinite" path="M150 424 V 194"/><circle r="7" fill="#ffb35c" opacity=".3"/><circle r="3.5" fill="#ffe3bd"/></g>
    <rect x="98" y="293" width="104" height="24" rx="12" fill="#0d3a33" stroke="#ffb35c" stroke-width="1.5"/>
    <text class="chipT" x="150" y="309" text-anchor="middle" fill="#ffd9a8">next task ↺</text>
  </g>

  <!-- feedback loop: review → agent -->
  <g class="rise d5">
    <path class="flowT" d="M735 460 C 640 460, 640 170, 727 170" marker-end="url(#arT)"/>
    <g class="comet"><animateMotion dur="2.6s" repeatCount="indefinite" path="M735 460 C 640 460, 640 170, 727 170"/><circle r="8" fill="#43dcc6" opacity=".3"/><circle r="4" fill="#c8fff4"/></g>
    <rect x="572" y="303" width="160" height="24" rx="12" fill="#0d3a33" stroke="#43dcc6" stroke-width="1.5"/>
    <text class="chipT" x="652" y="319" text-anchor="middle" fill="#a9f0e4">feedback → @copilot</text>
  </g>

  <!-- card 1: you -->
  <g class="rise d1">
    <rect x="55" y="94" width="190" height="92" rx="16" fill="url(#gYou)" stroke="#ff9f1c" stroke-width="2" filter="url(#softD)"/>
    <circle cx="69" cy="94" r="12" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="69" y="98.5" text-anchor="middle">1</text>
    <circle cx="150" cy="128" r="18" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
    <g transform="translate(150 128)"><g class="bob" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6.5 6.5 L-4.8 1.8 L5.5 -8.5 A2.4 2.4 0 0 1 8.5 -5.5 L-1.8 4.8 Z"/>
    </g></g>
    <text class="ttl" x="150" y="158" text-anchor="middle" fill="#8a5a00">You</text>
    <text class="sub" x="150" y="175" text-anchor="middle" fill="#8a5a00">write a crisp issue</text>
  </g>

  <!-- card 2: agent -->
  <g class="rise d2">
    <rect x="735" y="94" width="190" height="92" rx="16" fill="url(#gBot)" stroke="#1fae9c" stroke-width="2" filter="url(#softD)"/>
    <circle cx="749" cy="94" r="12" fill="#1fae9c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="749" y="98.5" text-anchor="middle">2</text>
    <circle cx="830" cy="128" r="18" fill="#fff" stroke="#1fae9c" stroke-width="2"/>
    <g transform="translate(830 128)"><g class="bob2" stroke="#0c7a6b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5" width="16" height="12" rx="3.5"/>
      <line x1="0" y1="-5" x2="0" y2="-9"/>
      <circle cx="0" cy="-10.5" r="1.4" fill="#0c7a6b" stroke="none"/>
      <circle cx="-3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <circle cx="3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <line x1="-8" y1="1" x2="-11" y2="1"/>
      <line x1="8" y1="1" x2="11" y2="1"/>
    </g></g>
    <text class="ttl" x="830" y="158" text-anchor="middle" fill="#0c7a6b">Coding Agent</text>
    <text class="sub" x="830" y="175" text-anchor="middle" fill="#0c7a6b">works autonomously</text>
  </g>

  <!-- card 3: review -->
  <g class="rise d3">
    <rect x="735" y="424" width="190" height="92" rx="16" fill="url(#gYou)" stroke="#ff9f1c" stroke-width="2" filter="url(#softD)"/>
    <circle cx="749" cy="424" r="12" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="749" y="428.5" text-anchor="middle">3</text>
    <circle cx="830" cy="458" r="18" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
    <g transform="translate(830 458)"><g class="bob" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 0 C -5 -5.5, 5 -5.5, 9 0 C 5 5.5, -5 5.5, -9 0 Z"/>
      <circle cx="0" cy="0" r="2.4"/>
    </g></g>
    <text class="ttl" x="830" y="488" text-anchor="middle" fill="#8a5a00">You review</text>
    <text class="sub" x="830" y="505" text-anchor="middle" fill="#8a5a00">the pull request</text>
  </g>

  <!-- card 4: merge -->
  <g class="rise d4">
    <rect x="55" y="424" width="190" height="92" rx="16" fill="url(#gOk)" stroke="#2ea043" stroke-width="2" filter="url(#softD)"/>
    <circle cx="69" cy="424" r="12" fill="#2ea043" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="69" y="428.5" text-anchor="middle">4</text>
    <circle cx="150" cy="458" r="18" fill="#fff" stroke="#2ea043" stroke-width="2"/>
    <g transform="translate(150 458)"><g class="bob2" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="-6" cy="-5.5" r="2.4"/>
      <circle cx="-6" cy="5.5" r="2.4"/>
      <circle cx="6" cy="0" r="2.4"/>
      <path d="M-3.6 -5.5 C 0 -5.5, 0 0, 3.4 0"/>
      <path d="M-3.6 5.5 C 0 5.5, 0 0, 3.4 0"/>
    </g></g>
    <text class="ttl" x="150" y="488" text-anchor="middle" fill="#1a7f37">Merge</text>
    <text class="sub" x="150" y="505" text-anchor="middle" fill="#1a7f37">milestone ✓</text>
  </g>

  <!-- center: certificate medal -->
  <g class="rise d6">
    <circle cx="490" cy="300" r="60" fill="url(#glowO)"/>
    <circle class="haloA" cx="490" cy="300" r="72" fill="none" stroke="#ffb35c" stroke-width="2" stroke-dasharray="3 9" opacity=".5"/>
    <circle class="haloB" cx="490" cy="300" r="88" fill="none" stroke="#55d8c7" stroke-width="1.5" stroke-dasharray="2 12" opacity=".35"/>
    <text x="490" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffd9a8">6/6 milestones → certificate</text>
    <g class="pulseMedal">
      <path d="M480 328 L472 352 L482 346 L490 357 L498 346 L508 352 L500 328 Z" fill="#ff7b1c"/>
      <circle cx="490" cy="300" r="30" fill="url(#gMedal)" stroke="#e08a00" stroke-width="2"/>
      <path d="M478 300 l8 8 16 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="shine" d="M490 274 a26 26 0 0 1 22 11" stroke="#fff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    </g>
  </g>
</svg>
