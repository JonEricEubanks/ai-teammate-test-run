<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3fbf8"/><stop offset="1" stop-color="#e6f5ef"/></linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fae9c"/><stop offset=".55" stop-color="#55d8c7"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
    <filter id="softP" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10443d" flood-opacity="0.16"/></filter>
  </defs>
  <style>
    .t { font-size: 15.5px; font-weight: 700; fill: #17262b; }
    .d { font-size: 12px; fill: #4f6066; }
    .num { font-size: 11px; font-weight: 800; fill: #fff; }
    .pop { animation: pop .55s cubic-bezier(.22,1,.36,1) both; transform-origin: center; transform-box: fill-box; }
    .p1{animation-delay:.25s}.p2{animation-delay:.5s}.p3{animation-delay:.75s}.p4{animation-delay:1s}.p5{animation-delay:1.9s}.pE{animation-delay:1.15s}
    @keyframes pop { from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)} }
    .prog { stroke-dasharray: 740; stroke-dashoffset: 740; animation: draw 1.7s .35s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .orb { animation: spinO 14s linear infinite; }
    @keyframes spinO { to { transform: rotate(360deg) } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:0} }
    .spinFast { animation: spinO 4s linear infinite; }
    .ck  { stroke-dasharray: 18; animation: ck 2.4s ease-in-out infinite; }
    .ck2 { stroke-dasharray: 14; animation: ck 2.4s .6s ease-in-out infinite; }
    @keyframes ck { 0%{stroke-dashoffset:18} 45%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    .rip { fill:none; stroke:#1fae9c; stroke-width:2; opacity:0; animation: ripple 2.6s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    .rip2 { animation-delay: 1.3s; }
    @keyframes ripple { 0%{opacity:.6; transform:scale(.7)} 100%{opacity:0; transform:scale(1.6)} }
    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; }
      .prog { stroke-dashoffset: 0; animation: none; }
      .orb,.spinFast,.blink,.ck,.ck2 { animation: none; }
      .rip,.rip2,.comet { display: none; }
    }
  </style>

  <!-- backdrop -->
  <rect x="8" y="8" width="944" height="324" rx="24" fill="url(#bgL)" stroke="#d6ebe3"/>
  <text x="36" y="40" font-size="10.5" letter-spacing="2.5" font-weight="700" fill="#8595a0">FROM ISSUE TO MERGED PR</text>

  <!-- beam -->
  <line x1="110" y1="116" x2="850" y2="116" stroke="#cfe7df" stroke-width="6" stroke-linecap="round"/>
  <path class="prog" d="M110 116 H 850" stroke="url(#beamG)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g class="comet"><animateMotion dur="3s" begin="2.1s" repeatCount="indefinite" path="M110 116 H 850"/><circle r="9" fill="#ff9f1c" opacity=".25"/><circle r="4.5" fill="#ffd9a8"/></g>

  <!-- finish flag -->
  <g class="pop p5">
    <line x1="884" y1="98" x2="884" y2="132" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M884 100 h24 l-6 7 6 7 h-24 z" fill="#ff9f1c"/>
  </g>

  <!-- step 1: assignment -->
  <g class="pop p1">
    <circle class="orb" style="transform-origin:110px 116px" cx="110" cy="116" r="46" fill="none" stroke="#ff9f1c" stroke-width="1.5" stroke-dasharray="2 8" opacity=".3"/>
    <circle cx="110" cy="116" r="32" fill="#fff" stroke="#ff9f1c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(110 116)" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="-8" y="-10" width="16" height="20" rx="2.5"/>
      <line x1="-4" y1="-4" x2="4" y2="-4"/>
      <line x1="-4" y1="0" x2="4" y2="0"/>
    </g>
    <rect class="blink" x="108" y="120" width="2.4" height="6" fill="#e08a00"/>
    <circle cx="134" cy="94" r="11" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="134" y="98" text-anchor="middle">1</text>
    <text class="pop pE" x="150" y="74" text-anchor="middle" font-size="13">👀</text>
    <text class="t" x="110" y="182" text-anchor="middle">Assignment</text>
    <text class="d" x="110" y="202" text-anchor="middle">issue → @copilot</text>
    <text class="d" x="110" y="219" text-anchor="middle">adds a 👀 reaction</text>
  </g>

  <!-- step 2: autonomous dev -->
  <g class="pop p2">
    <circle class="orb" style="transform-origin:350px 116px" cx="350" cy="116" r="46" fill="none" stroke="#1fae9c" stroke-width="1.5" stroke-dasharray="2 8" opacity=".3"/>
    <circle class="rip" cx="350" cy="116" r="32"/>
    <circle class="rip rip2" cx="350" cy="116" r="32"/>
    <circle cx="350" cy="116" r="32" fill="#fff" stroke="#1fae9c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(350 116)" stroke="#0c7a6b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5" width="16" height="12" rx="3.5"/>
      <line x1="0" y1="-5" x2="0" y2="-9"/>
      <circle cx="0" cy="-10.5" r="1.4" fill="#0c7a6b" stroke="none"/>
      <circle cx="-3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <circle cx="3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <line x1="-8" y1="1" x2="-11" y2="1"/>
      <line x1="8" y1="1" x2="11" y2="1"/>
    </g>
    <g class="spinFast" style="transform-origin:350px 116px">
      <circle cx="350" cy="116" r="17" fill="none" stroke="#1fae9c" stroke-width="1.5" stroke-dasharray="2 5" opacity=".6"/>
      <circle cx="367" cy="116" r="2.2" fill="#ff9f1c"/>
      <circle cx="333" cy="116" r="2.2" fill="#ff9f1c"/>
    </g>
    <circle cx="374" cy="94" r="11" fill="#1fae9c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="374" y="98" text-anchor="middle">2</text>
    <text class="t" x="350" y="182" text-anchor="middle">Autonomous dev</text>
    <text class="d" x="350" y="202" text-anchor="middle">plans, branches,</text>
    <text class="d" x="350" y="219" text-anchor="middle">commits incrementally</text>
  </g>

  <!-- step 3: quality check -->
  <g class="pop p3">
    <circle class="orb" style="transform-origin:590px 116px" cx="590" cy="116" r="46" fill="none" stroke="#ff9f1c" stroke-width="1.5" stroke-dasharray="2 8" opacity=".3"/>
    <circle cx="590" cy="116" r="32" fill="#fff" stroke="#ff9f1c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(590 116)">
      <path d="M0 -10 L8 -7.5 V0.5 C8 6, 4 8.5, 0 10.5 C -4 8.5, -8 6, -8 0.5 V-7.5 Z" stroke="#e08a00" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <path class="ck" d="M-3.5 0.5 l2.5 2.5 5 -5.5" stroke="#0c7a6b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="614" cy="94" r="11" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="614" y="98" text-anchor="middle">3</text>
    <text class="t" x="590" y="182" text-anchor="middle">Quality check</text>
    <text class="d" x="590" y="202" text-anchor="middle">runs tests &amp; linters</text>
    <text class="d" x="590" y="219" text-anchor="middle">documents reasoning</text>
  </g>

  <!-- step 4: PR &amp; review -->
  <g class="pop p4">
    <circle class="orb" style="transform-origin:830px 116px" cx="830" cy="116" r="46" fill="none" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="2 8" opacity=".3"/>
    <circle cx="830" cy="116" r="32" fill="#fff" stroke="#2ea043" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(830 116)" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="-6" cy="-6" r="2.6"/>
      <circle cx="6" cy="6" r="2.6"/>
      <line x1="-6" y1="-3.4" x2="-6" y2="9"/>
      <path class="ck2" d="M-1 -6 H 3.4 C 5.5 -6, 6 -5, 6 -3.4 V 3.2"/>
    </g>
    <circle cx="854" cy="94" r="11" fill="#2ea043" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="854" y="98" text-anchor="middle">4</text>
    <text class="t" x="830" y="182" text-anchor="middle">PR &amp; review</text>
    <text class="d" x="830" y="202" text-anchor="middle">draft PR + session logs</text>
    <text class="d" x="830" y="219" text-anchor="middle">iterates on feedback</text>
  </g>
</svg>
