<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ee"/><stop offset="1" stop-color="#fdf1dc"/></linearGradient>
    <linearGradient id="gc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3e0"/><stop offset="1" stop-color="#fce9cb"/></linearGradient>
    <linearGradient id="gc3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7c2"/><stop offset="1" stop-color="#ffd79d"/></linearGradient>
    <linearGradient id="gHot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffb45c"/></linearGradient>
    <radialGradient id="glowOs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9f1c" stop-opacity=".55"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
    <filter id="softS" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7a5a1e" flood-opacity="0.13"/></filter>
  </defs>
  <style>
    .name { font-size: 14px; font-weight: 700; fill: #17262b; }
    .how  { font-size: 11.5px; fill: #4f6066; }
    .pill { font-size: 9px; font-weight: 800; letter-spacing: .5px; }
    .lvl  { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; fill: #b59a6b; }
    .num  { font-size: 11px; font-weight: 800; fill: #fff; }
    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.22,1,.36,1) both; }
    .g1{animation-delay:.05s}.g2{animation-delay:.2s}.g3{animation-delay:.35s}.g4{animation-delay:.5s}
    @keyframes grow { from{opacity:0; transform:scaleY(0)} to{opacity:1; transform:scaleY(1)} }
    .fade { animation: fade .5s ease both; }
    .f1{animation-delay:.6s}.f2{animation-delay:.75s}.f3{animation-delay:.9s}.f4{animation-delay:1.05s}
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .traj { stroke:#ff9f1c; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-dasharray:7 7; animation: trm 1s linear infinite; opacity:.85; }
    @keyframes trm { to { stroke-dashoffset: -14; } }
    .glow { animation: gl 2.4s ease-in-out infinite; }
    @keyframes gl { 0%,100%{opacity:0} 50%{opacity:.8} }
    .flame { transform-box: fill-box; transform-origin: center; animation: fl .5s ease-in-out infinite alternate; }
    @keyframes fl { from{transform:scale(1)} to{transform:scale(.55)} }
    @media (prefers-reduced-motion: reduce) {
      .grow,.fade,.traj,.glow,.flame { animation: none; }
      .comet { display: none; }
    }
  </style>

  <!-- backdrop -->
  <rect x="8" y="8" width="944" height="304" rx="24" fill="url(#bgC)" stroke="#f1e3c6"/>
  <text x="36" y="42" font-size="10.5" letter-spacing="2.5" font-weight="700" fill="#a8874f">THE AUTONOMY SPECTRUM</text>
  <text class="lvl" x="48" y="300">AUTONOMY →</text>

  <!-- rocket trajectory -->
  <path class="traj fade f1" d="M98 214 C 260 150, 380 122, 520 96 S 720 52, 812 40"/>
  <g class="comet">
    <animateMotion dur="4.5s" begin="1s" repeatCount="indefinite" rotate="auto" path="M98 214 C 260 150, 380 122, 520 96 S 720 52, 812 40"/>
    <circle r="10" fill="url(#glowOs)"/>
    <circle class="flame" cx="-15" cy="0" r="3" fill="#ffb35c"/>
    <path d="M11 0 C 5 -6.5, -5 -6.5, -12 0 C -5 6.5, 5 6.5, 11 0 Z" fill="#fff" stroke="#e8720c" stroke-width="1.8"/>
    <path d="M-7 -4.5 L-14 -9 L-10 -2.5 Z" fill="#ff7b1c"/>
    <path d="M-7 4.5 L-14 9 L-10 2.5 Z" fill="#ff7b1c"/>
    <circle cx="3" cy="0" r="1.6" fill="#55d8c7"/>
  </g>

  <!-- level 1: autocomplete -->
  <g class="grow g1">
    <rect x="48" y="224" width="195" height="56" rx="14" fill="#ffffff" stroke="#e3cfae" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="48" cy="224" r="11" fill="#d9b98a" stroke="#fff" stroke-width="2"/>
    <text class="num" x="48" y="228.5" text-anchor="middle">1</text>
    <circle cx="76" cy="251" r="13" fill="#faf3e4" stroke="#d9b98a" stroke-width="1.5"/>
    <g transform="translate(76 251)" stroke="#b07503" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-2.5 -5.5 H 2.5 M0 -5.5 V 5.5 M-2.5 5.5 H 2.5"/>
    </g>
    <text class="name" x="98" y="247">Autocomplete</text>
    <text class="how" x="98" y="263">AI suggests, you type</text>
    <g class="fade f1">
      <rect x="187" y="201" width="74" height="18" rx="9" fill="#ffffff" stroke="#d9b98a" stroke-width="1.5"/>
      <text class="pill" x="224" y="213" text-anchor="middle" fill="#a8650a">YOU DRIVE</text>
    </g>
  </g>

  <!-- level 2: chat / ask -->
  <g class="grow g2">
    <rect x="266" y="176" width="195" height="104" rx="14" fill="url(#gc2)" stroke="#f0bd6b" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="266" cy="176" r="11" fill="#f0bd6b" stroke="#fff" stroke-width="2"/>
    <text class="num" x="266" y="180.5" text-anchor="middle">2</text>
    <circle cx="294" cy="203" r="13" fill="#fdf0d8" stroke="#eab566" stroke-width="1.5"/>
    <g transform="translate(294 203)" stroke="#b07503" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7.5" y="-5.5" width="15" height="10" rx="3"/>
      <path d="M-3.5 4.5 L-5 8 L-1 4.5"/>
    </g>
    <text class="name" x="316" y="199">Chat / Ask</text>
    <text class="how" x="316" y="215">you ask, AI answers</text>
    <text class="lvl" x="363" y="270" text-anchor="middle">LEVEL 2</text>
    <g class="fade f2">
      <rect x="405" y="153" width="74" height="18" rx="9" fill="#ffffff" stroke="#eab566" stroke-width="1.5"/>
      <text class="pill" x="442" y="165" text-anchor="middle" fill="#a8650a">YOU DRIVE</text>
    </g>
  </g>

  <!-- level 3: agent mode (IDE) -->
  <g class="grow g3">
    <rect x="484" y="128" width="195" height="152" rx="14" fill="url(#gc3)" stroke="#f5a83c" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="484" cy="128" r="11" fill="#f5a83c" stroke="#fff" stroke-width="2"/>
    <text class="num" x="484" y="132.5" text-anchor="middle">3</text>
    <circle cx="512" cy="155" r="13" fill="#fff" stroke="#f5a83c" stroke-width="1.5"/>
    <g transform="translate(512 155)" stroke="#b07503" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7.5" y="-6.5" width="15" height="13" rx="2"/>
      <line x1="-7.5" y1="-2.5" x2="7.5" y2="-2.5"/>
      <path d="M-3.5 1 l-2.2 2.2 2.2 2.2 M3.5 1 l2.2 2.2 -2.2 2.2"/>
    </g>
    <text class="name" x="534" y="151">Agent mode (IDE)</text>
    <text class="how" x="534" y="167">pair + approve steps</text>
    <text class="lvl" x="581" y="270" text-anchor="middle">LEVEL 3</text>
    <g class="fade f3">
      <rect x="632" y="105" width="66" height="18" rx="9" fill="#ffffff" stroke="#d98f1f" stroke-width="1.5"/>
      <text class="pill" x="665" y="117" text-anchor="middle" fill="#a8650a">SHARED</text>
    </g>
  </g>

  <!-- level 4: coding agent -->
  <g class="grow g4">
    <rect class="glow" x="702" y="80" width="195" height="200" rx="14" fill="none" stroke="#ffc35c" stroke-width="3"/>
    <rect x="702" y="80" width="195" height="200" rx="14" fill="url(#gHot)" stroke="#ff9f1c" stroke-width="2" filter="url(#softS)"/>
    <circle cx="702" cy="80" r="11" fill="#ff7b1c" stroke="#fff" stroke-width="2"/>
    <text class="num" x="702" y="84.5" text-anchor="middle">4</text>
    <circle cx="730" cy="107" r="13" fill="#fff" stroke="#ff9f1c" stroke-width="1.5"/>
    <g transform="translate(730 107)" stroke="#e8720c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -8 C 3 -5.5, 3.5 -1, 2.5 3 L -2.5 3 C -3.5 -1, -3 -5.5, 0 -8 Z"/>
      <path d="M-2.5 1.5 L -5 5.5 M2.5 1.5 L 5 5.5"/>
      <circle cx="0" cy="-2.5" r="1.1" fill="#55d8c7" stroke="none"/>
    </g>
    <text class="name" x="752" y="103">Coding Agent</text>
    <text class="how" x="752" y="119">you delegate → PR</text>
    <text class="lvl" x="799" y="270" text-anchor="middle">LEVEL 4</text>
    <g class="fade f4">
      <rect x="752" y="132" width="74" height="18" rx="9" fill="#ff7b1c"/>
      <text class="pill" x="789" y="144" text-anchor="middle" fill="#ffffff">AI DRIVES</text>
    </g>
  </g>

  <text transform="rotate(-90 930 190)" x="930" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a8650a">who drives: you → AI</text>
</svg>
